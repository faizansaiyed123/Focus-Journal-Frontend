name: Frontend CI

on:
  push:
    branches: [main]
    paths:
      - "focus-journal-frontend/**"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "focus-journal-frontend/**"
      - ".github/workflows/frontend-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: focus-journal-frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: focus-journal-frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint source files
        run: npm run lint
      - name: Build production bundle
        run: npm run build
