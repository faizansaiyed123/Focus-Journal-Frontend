name: Temporary frontend formatting

on:
  push:
    branches:
      - format/readable-prettier-80col
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: focus-journal-frontend
    steps:
      - name: Check out formatting branch
        uses: actions/checkout@v4
        with:
          ref: format/readable-prettier-80col

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: focus-journal-frontend/package-lock.json

      - name: Update lockfile for Prettier
        run: npm install --no-audit --no-fund

      - name: Verify clean locked installation
        run: npm ci --no-audit

      - name: Format project files
        run: npm run format

      - name: Verify formatting
        run: npm run format:check

      - name: Check existing lint baseline
        run: npm run lint -- --max-warnings=0
        continue-on-error: true

      - name: Verify production build
        run: npm run build

      - name: Verify whitespace
        run: git diff --check
        working-directory: .

      - name: Commit formatted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add focus-journal-frontend
          if ! git diff --cached --quiet; then
            git commit -m "style: format frontend for readability"
            git push origin HEAD:format/readable-prettier-80col
          else
            echo "No formatting changes to commit."
          fi
        working-directory: .
