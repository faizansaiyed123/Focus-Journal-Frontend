name: Temporary frontend verification

on:
  push:
    branches:
      - format/readable-prettier-80col
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: focus-journal-frontend
    steps:
      - name: Check out formatting branch
        uses: actions/checkout@v4
        with:
          ref: format/readable-prettier-80col

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: focus-journal-frontend/package-lock.json

      - name: Resolve patched dependencies and refresh lockfile
        run: npm install --no-audit --no-fund

      - name: Verify clean locked installation
        run: npm ci --no-audit

      - name: Check dependency vulnerabilities
        run: npm audit --audit-level=low

      - name: Apply formatting
        run: npm run format

      - name: Verify formatting
        run: npm run format:check

      - name: Verify lint
        run: npm run lint -- --max-warnings=0

      - name: Verify production build
        run: npm run build

      - name: Verify whitespace
        run: git diff --check
        working-directory: .

      - name: Commit verified fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add focus-journal-frontend
          if ! git diff --cached --quiet; then
            git commit -m "fix: resolve frontend lint and dependency audit findings"
            git push origin HEAD:format/readable-prettier-80col
          else
            echo "No generated changes to commit."
          fi
        working-directory: .
